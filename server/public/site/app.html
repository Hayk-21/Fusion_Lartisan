<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application tablette, Fusion L'Artisan</title>
<link rel="icon" href="/shared/logo-mark.png">
<link rel="stylesheet" href="/site.css">
<style>
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:30px 26px;max-width:560px;margin:30px auto;text-align:center}
.card img.logo{height:110px;margin-bottom:8px}
.big{font-size:20px;padding:18px 28px;width:100%;justify-content:center}
ol{text-align:left;color:var(--muted);font-size:15px;padding-left:22px}
ol li{margin:8px 0}
.meta{color:var(--muted);font-size:13px;margin-top:12px}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <img class="logo" src="/shared/logo-full.png" alt="">
    <h2 id="title">Application tablette</h2>
    <p class="muted" id="sub">Menu et prise de commande pour les tablettes du café.</p>
    <div id="body"><p class="muted">…</p></div>
    <div class="lang" style="justify-content:center;margin-top:18px"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
  </div>
</main>
<script>
(function () {
  const STR = {
    fr: { title: 'Application tablette', sub: 'Menu et prise de commande pour les tablettes du café.', dl: '⬇ Installer l\'application', none: "Aucune application n'a encore été publiée. L'administrateur doit la téléverser dans le panneau (onglet Tablettes).",
      steps: ['Touchez le bouton ci-dessus : le fichier .apk se télécharge.', 'Ouvrez-le depuis la barre de notifications (ou le dossier Téléchargements).', 'Si Android demande « Autoriser l\'installation d\'applications inconnues », acceptez pour ce navigateur.', 'Touchez Installer. L\'application se connecte toute seule au serveur du café.'],
      meta: 'Version {v} · {s} Mo · publiée le {d}' },
    en: { title: 'Tablet app', sub: 'Menu and order-taking app for the café tablets.', dl: '⬇ Install the app', none: 'No app has been published yet. The admin must upload it in the panel (Tablets tab).',
      steps: ['Tap the button above: the .apk file downloads.', 'Open it from the notification bar (or the Downloads folder).', 'If Android asks to "Allow installing unknown apps", allow it for this browser.', 'Tap Install. The app connects to the café server by itself.'],
      meta: 'Version {v} · {s} MB · published {d}' },
  };
  let lang = localStorage.getItem('site_lang') || ((navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr');
  let info = null;
  const t = k => STR[lang][k];
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.getElementById('title').textContent = t('title'); document.getElementById('sub').textContent = t('sub');
    const body = document.getElementById('body');
    if (!info) { body.innerHTML = `<p class="muted">${t('none')}</p>`; return; }
    const d = new Date(info.uploaded_at).toLocaleDateString(lang === 'en' ? 'en-CA' : 'fr-CA');
    body.innerHTML = `<a class="btn primary big" href="/app/lartisan.apk">${t('dl')}</a>
      <div class="meta">${t('meta').replace('{v}', info.version || '—').replace('{s}', (info.size / 1048576).toFixed(1)).replace('{d}', d)}</div>
      <ol>${t('steps').map(x => `<li>${x}</li>`).join('')}</ol>`;
  }
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; localStorage.setItem('site_lang', lang); render(); });
  fetch('/api/app/info').then(r => r.json()).then(j => { info = j.app; render(); }).catch(render);
  render();
})();
</script>
</body>
</html>
