<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menu, Fusion L'Artisan</title>
<meta name="description" content="Menu et commande en ligne de Fusion L'Artisan, crêperie et café à Montréal.">
<link rel="icon" href="/shared/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kiosk/kiosk.css">
</head>
<body>
<div id="closedBanner" class="banner hidden"></div>
<header class="top">
  <a class="brand" id="brandLink" href="/"><img id="navLogo" src="/shared/logo-mark.png" alt=""><span class="brand-txt"><b id="navName">Fusion L'Artisan</b><small id="navSub"></small></span></a>
  <div class="tagline"><div class="kicker" id="kicker"></div><div class="slogan" id="slogan"></div></div>
  <div class="top-right">
    <div class="lang"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
    <span class="badge" id="openBadge"><span class="dot"></span><span id="openText">…</span></span>
    <button class="icon-btn hidden" id="fsBtn" title="Plein écran">⛶</button>
    <div class="clock"><b id="clockTime">--:--</b><small id="clockDate"></small></div>
  </div>
</header>

<div class="app">
  <nav class="side" id="side">
    <div class="nav" id="nav"></div>
    <button class="promo hidden" id="promo"></button>
  </nav>
  <main class="main" id="main">
    <section class="hero" id="hero"></section>
    <div class="head" id="head"></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="cart" id="cartAside"></aside>
</div>

<!-- bottom bar (phones / small screens only) -->
<footer class="bar" id="bar">
  <button class="btn ghost big hidden" id="backBtn">← <span data-i18n="back">Retour</span></button>
  <div class="bar-spacer"></div>
  <button class="btn primary big" id="cartBtn" disabled><span id="cartBtnText"></span></button>
</footer>

<!-- item sheet -->
<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetCard"></div></div>
<!-- confirm panel -->
<div id="cartPanel" class="sheet hidden"><div class="sheet-card wide" id="cartCard"></div></div>
<!-- PIN gate (counter mode) -->
<div id="pinGate" class="pin-gate hidden">
  <div class="pin-card">
    <img src="/shared/logo-full-t.png" alt="" class="pin-logo">
    <h2 data-i18n="localTitle">Mode comptoir</h2>
    <p class="muted" data-i18n="localHint">Entrez le code PIN pour ouvrir le menu du café.</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="pin-pad" id="pinPad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="clear" class="ghost" data-i18n="clear">Effacer</button><button data-k="0">0</button><button data-k="ok" class="primary">OK</button>
    </div>
    <p id="pinError" class="pin-error"></p>
  </div>
</div>
<!-- welcome screen (counter / tablets): language + dine in / take out. Sits below the header. -->
<div id="welcome" class="welcome hidden">
  <div class="w-bg" id="wBg"></div>
  <div class="w-card">
    <img src="/shared/logo-full-t.png" alt="" class="w-logo" id="wLogo">
    <p class="w-slogan" id="wSlogan"></p>
    <div class="w-lang">
      <button data-wlang="fr"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" fill="#0055A4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#EF4135"/></svg>Français</button>
      <button data-wlang="en"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#C8102E" stroke-width="1.6"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#C8102E" stroke-width="3.2"/></svg>English</button>
    </div>
    <h2 class="w-q" id="wQuestion"></h2>
    <div class="w-choices">
      <button data-wsvc="dine_in"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity=".7"/><path d="M9 12v14a5 5 0 0 0 10 0V12M14 12v40M9 12h0M19 12h0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M52 12c-4 2-6 8-6 14v6h6V12zM52 32v20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="wDine"></b></button>
      <button data-wsvc="takeout"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 22h36l-3 32H17z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M23 22v-4a9 9 0 0 1 18 0v4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M24 34h16" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg><b id="wTake"></b></button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="/kiosk/kiosk.js"></script>
</body>
</html>
